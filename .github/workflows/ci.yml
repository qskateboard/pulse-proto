name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: false
          breaking: false
          push: false
          archive: false
      - name: breaking against the previous tag
        run: |
          set -eu
          prev=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)
          if [ -z "$prev" ]; then echo "no previous tag, skipping"; exit 0; fi
          echo "comparing with $prev"
          buf breaking --against ".git#tag=$prev"
